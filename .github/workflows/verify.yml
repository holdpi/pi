name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source, models and review packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm run setup
      - run: python3 -m pip install -r requirements-dev.txt
      - run: npm run check
  fork:
    name: BNB fork contract invariants
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PI_FORK_URL: https://bsc-rpc.publicnode.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm run setup
      - run: rm -f outputs/contract-verification.json
      - run: npm run test:contracts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fork-verification
          path: outputs/contract-verification.json
          retention-days: 14
          if-no-files-found: warn
